<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>狼羊棋</title>
    <link rel="stylesheet" href="styles.css?v=20260516-capture-rule">
  </head>
  <body>
    <main class="app-shell">
      <section class="game-area" aria-label="狼羊棋棋盘">
        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="6乘6狼羊棋棋盘"></div>
        </div>
      </section>

      <aside class="status-panel" aria-label="游戏状态">
        <div>
          <p class="eyebrow">北方民间棋</p>
          <h1>狼羊棋</h1>
        </div>

        <dl class="stats">
          <div>
            <dt>当前回合</dt>
            <dd id="turnText">狼方</dd>
          </div>
          <div>
            <dt>剩余羊数</dt>
            <dd id="remainingSheep">24</dd>
          </div>
          <div>
            <dt>已吃羊数</dt>
            <dd id="capturedSheep">0</dd>
          </div>
        </dl>

        <p id="message" class="message" aria-live="polite">狼方先走。</p>

        <div class="actions">
          <button id="undoButton" type="button">撤销一步</button>
          <button id="restartButton" type="button">重新开始</button>
        </div>
      </aside>
    </main>

    <script type="module" src="game.js?v=20260516-capture-rule"></script>
  </body>
</html>
